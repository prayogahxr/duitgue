# Bangun dan terbitkan ke GitHub Pages tiap kali ada push ke main.
#
# Yang diterbitkan cuma isi dist/. Tidak ada rahasia, tidak ada environment
# variable — aplikasinya berjalan sepenuhnya di browser pengunjung.
name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  # Bisa juga dijalankan manual dari tab Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Kalau ada dua push beruntun, yang lama dibatalkan — bukan diantre.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Test ikut jalan sebelum terbit. Kalau validasi parser rusak,
      # jangan sampai versi rusak itu yang online.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  terbitkan:
    needs: bangun
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
